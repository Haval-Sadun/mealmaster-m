services:
  web:
    build: .
    command: uvicorn mainapp.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  keycloak-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: havalo
      POSTGRES_PASSWORD: admin
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: havalo
      KC_DB_PASSWORD: admin
      KC_HOSTNAME: localhost  
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8180:8080"
    depends_on:
      - keycloak-db

volumes:
  postgres_data:
  keycloak_data:


  # ngrok authtoken <your_auth_token>
  # ngrok http http://localhost:8180 --host-header="localhost:8180" since the keycloak runs on a port 8180
  # issuer is  -> https://dermic-captiously-enrique.ngrok-free.dev it will reidirect to your localhost keycloak instance
  # callback is : https://idp.ngrok.com/oauth2/callback
  